name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - if: github.repository != 'ismailguderer/bio-assist'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.repository != 'ismailguderer/bio-assist'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  update-site:
    if: github.repository == 'ismailguderer/bio-assist'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a rebuild of ismailguderer.github.io
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SITE_DISPATCH_TOKEN secret is missing; the site was not rebuilt."
            exit 1
          fi
          gh api repos/ismailguderer/ismailguderer.github.io/dispatches -f event_type=bio-assist-updated
